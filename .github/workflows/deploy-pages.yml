name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - arena/ebd36b53-robloxclinetbooster
    paths:
      - "web/**"
      - "index.html"
      - "404.html"
      - ".nojekyll"
      - "build_website.py"
      - "build_downloads.py"
      - "build_screenshots.py"
      - "feature-status.json"
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate screenshots, website, and downloads
        run: |
          python build_screenshots.py
          python build_downloads.py
          python build_website.py --check

      - name: Confirm Pages entry files
        run: |
          test -f web/index.html
          test -f web/.nojekyll
          test -f web/404.html
          test -f index.html
          test -f .nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
