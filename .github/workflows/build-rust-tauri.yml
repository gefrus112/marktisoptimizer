name: Build Rust + Tauri Windows client

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - arena/48fc7138-robloxclinetbooster
      - arena/f2b9b777-robloxclinetbooster
      - arena/1443a973-robloxclinetbooster
    paths:
      - "rust/**"
      - "web/**"
      - "fastflags-allowlist.json"
      - "feature-status.json"
      - "build_website.py"
      - "build_tauri_frontend.py"
      - "docs/**"
      - ".github/workflows/build-rust-tauri.yml"
      - ".github/workflows/release-upload-rust.flag"

permissions:
  contents: write

concurrency:
  group: rust-tauri
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust/src-tauri/Cargo.toml') }}

      - name: Validate website and assemble separate desktop UI
        run: |
          python build_website.py
          python build_website.py --check
          python build_tauri_frontend.py
          python build_tauri_frontend.py --check

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Run Rust unit tests
        working-directory: rust/src-tauri
        shell: pwsh
        run: |
          $testLog = Join-Path $env:RUNNER_TEMP "tauri-tests.log"
          cargo test 2>&1 | Tee-Object -FilePath $testLog
          $testExit = $LASTEXITCODE
          if ($testExit -ne 0) {
            $tail = (Get-Content $testLog -Tail 18) -join " | "
            $tail = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Rust unit test failure::$tail"
            exit $testExit
          }

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
          }
          $nsisDirs = @(
            (Join-Path ${env:ProgramFiles(x86)} "NSIS"),
            (Join-Path $env:ProgramFiles "NSIS")
          )
          foreach ($nsisDir in $nsisDirs) {
            if (Test-Path (Join-Path $nsisDir "makensis.exe")) {
              $nsisDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:PATH = "$nsisDir;$env:PATH"
            }
          }
          if (-not (Get-Command makensis.exe -ErrorAction SilentlyContinue)) {
            throw "NSIS makensis.exe is required to build the setup wizard."
          }

      - name: Build guided NSIS setup installer
        working-directory: rust/src-tauri
        shell: pwsh
        run: |
          $buildLog = Join-Path $env:RUNNER_TEMP "tauri-build.log"
          cargo tauri build --bundles nsis 2>&1 | Tee-Object -FilePath $buildLog
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $tail = (Get-Content $buildLog -Tail 18) -join " | "
            $tail = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Tauri build failure::$tail"
            exit $buildExit
          }

      - name: Stage Windows setup wizard + checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path rust/artifacts | Out-Null
          $bundleDir = "rust/src-tauri/target/release/bundle/nsis"
          $installer = Get-ChildItem -Path $bundleDir -Filter "*_x64-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "Tauri NSIS installer was not produced in $bundleDir" }
          Copy-Item $installer.FullName "rust/artifacts/Roptimer-Rust-Setup-x64.exe"
          $hash = (Get-FileHash "rust/artifacts/Roptimer-Rust-Setup-x64.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  Roptimer-Rust-Setup-x64.exe" | Out-File -Encoding ascii "rust/artifacts/Roptimer-Rust-Setup-x64.exe.sha256"
          Get-ChildItem rust/artifacts | Format-Table Name,Length

      - name: Upload Tauri setup artifact
        uses: actions/upload-artifact@v7
        with:
          name: Roptimer-Rust-Setup-x64
          path: rust/artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release assets
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $flag = ".github/workflows/release-upload-rust.flag"
          if (-not (Test-Path $flag)) { Write-Host "No release flag; skipping release upload."; exit 0 }
          $tag = (Get-Content $flag -Raw).Trim()
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "Roptimer $tag — Rust + Tauri setup wizard" --notes "Guided x64 installer for the Rust + Tauri Windows client. It detects Roblox locally, manages canonical allowlisted settings by default, and offers a separate experimental legacy FPS request that may be ignored. Main-page launch uses the standard roblox:// protocol; local settings are backed up before writes."
          }
          gh release upload $tag rust/artifacts/Roptimer-Rust-Setup-x64.exe rust/artifacts/Roptimer-Rust-Setup-x64.exe.sha256 --clobber
          $publishedAssets = gh release view $tag --json assets --jq '.assets[].name'
          if ($LASTEXITCODE -eq 0) {
            foreach ($oldAsset in @("Roptimer-Rust-x64.exe", "Roptimer-Rust-x64.exe.sha256")) {
              if ($publishedAssets -contains $oldAsset) {
                gh release delete-asset $tag $oldAsset --yes
              }
            }
          }
