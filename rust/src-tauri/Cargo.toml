[package]
name = "roptimer"
version = "4.0.0"
description = "Marktis Optimizer — safe, reversible Roblox settings for Windows"
authors = ["Marktis Optimizer"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/gefrus112/marktisoptimizer"

# The library target is required by Tauri v2 on mobile and desktop alike.
[lib]
name = "roptimer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# by default Tauri runs in production mode when `tauri build`
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
