  <path d="m211 58 67 38-67 39-67-39 67-38Z" fill="#172638" fill-opacity=".72" stroke="#8DEBFF" stroke-opacity=".57" stroke-width="1.1"/>
  <path d="M144 96v77l67 38v-76l-67-39Z" fill="#0E1B28" fill-opacity=".72" stroke="#82B8FF" stroke-opacity=".48" stroke-width="1.1"/>
  <path d="m211 135 67-39v77l-67 38v-76Z" fill="#101A28" fill-opacity=".67" stroke="#F08076" stroke-opacity=".4" stroke-width="1.1"/>
  <path d="m211 72 54 31v62l-54 31-54-31v-62l54-31Z" stroke="#68E5FF" stroke-opacity=".3" stroke-width="1"/>
  <g filter="url(#glow)" opacity=".62">
    <path d="m211 82 39 22v44l-39 23-39-23v-44l39-22Z" stroke="url(#edge)" stroke-width="7"/>
  </g>
  <path d="m211 82 39 22v44l-39 23-39-23v-44l39-22Z" fill="#0D1823" stroke="url(#edge)" stroke-width="1.6"/>
  <path d="M211 82v45m39-23-39 23-39-23m39 23v44" stroke="#9CEEFF" stroke-opacity=".78" stroke-width="1.4"/>
  <path d="m197 111 14-8 14 8v17l-14 8-14-8v-17Z" fill="url(#core)" fill-opacity=".94"/>
  <path d="M204 116h14m-14 6h14m-14 6h7" stroke="#06151D" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M70 76h40m-40 7h25m218 112h37m-37 7h24" stroke="#A3DDF0" stroke-opacity=".39" stroke-width="2" stroke-linecap="round"/>
