<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Roptimer V4 desktop app home screen preview</title>
  <desc id="desc">An illustrative preview of the Roptimer Rust and Tauri Windows app home screen, showing its Client, Allowlist, Downloads, and Docs navigation and the safe local-settings overview.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11101a"/><stop offset=".48" stop-color="#08080d"/><stop offset="1" stop-color="#050506"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9c8cff"/><stop offset=".65" stop-color="#72c7ff"/><stop offset="1" stop-color="#f2b65d"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11111a"/><stop offset="1" stop-color="#09090d"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f7cff"/><stop offset="1" stop-color="#4c80bd"/></linearGradient>
    <radialGradient id="aura"><stop offset="0" stop-color="#9c8cff" stop-opacity=".30"/><stop offset="1" stop-color="#9c8cff" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".025" stroke-width="1"/></pattern>
  </defs>

  <rect width="1280" height="900" rx="18" fill="url(#page)"/>
  <rect width="1280" height="900" rx="18" fill="url(#grid)"/>
  <circle cx="1060" cy="390" r="310" fill="url(#aura)"/>
  <circle cx="1090" cy="380" r="215" fill="none" stroke="#9c8cff" stroke-opacity=".13"/>
  <circle cx="1090" cy="380" r="160" fill="none" stroke="#72c7ff" stroke-opacity=".10"/>

  <!-- Native desktop title bar -->
  <rect width="1280" height="38" rx="18" fill="#09090d"/>
  <rect y="18" width="1280" height="20" fill="#09090d"/>
  <circle cx="18" cy="19" r="4" fill="#ff6b6b"/><circle cx="34" cy="19" r="4" fill="#f2b65d"/><circle cx="50" cy="19" r="4" fill="#72c7ff"/>
  <text x="72" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a1a0a6">Roptimer — Windows Client</text>
  <path d="M1197 18h12m25-5v12m24-12 12 12m0-12-12 12" fill="none" stroke="#a1a0a6" stroke-width="1.3" opacity=".75"/>
  <path d="M0 38h1280" stroke="#29292f"/>

  <!-- App navigation -->
  <rect y="39" width="1280" height="72" fill="#070709" fill-opacity=".96"/>
  <rect x="32" y="57" width="38" height="38" rx="11" fill="#171421" stroke="#9c8cff" stroke-opacity=".6"/>
  <text x="51" y="83" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#f4f1e9">R</text>
  <text x="82" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#f4f1e9">Roptimer</text>
  <rect x="166" y="65" width="38" height="21" rx="10" fill="#14131a" stroke="#29292f"/>
  <text x="185" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="800" fill="#a1a0a6">V4</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">
    <rect x="431" y="55" width="104" height="40" rx="10" fill="#171521" stroke="#9c8cff" stroke-opacity=".30"/>
    <text x="483" y="80" text-anchor="middle" fill="#f4f1e9">Client</text>
    <text x="574" y="80" text-anchor="middle" fill="#a1a0a6">Allowlist</text>
    <text x="683" y="80" text-anchor="middle" fill="#a1a0a6">Downloads</text>
    <text x="788" y="80" text-anchor="middle" fill="#a1a0a6">Docs</text>
  </g>
  <rect x="1005" y="57" width="54" height="36" rx="10" fill="#0d0d12" stroke="#29292f"/>
  <text x="1032" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#a1a0a6">◆  K</text>
  <rect x="1071" y="57" width="177" height="36" rx="10" fill="url(#primary)"/>
  <text x="1159" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Get the Windows app</text>
  <path d="M0 110h1280" stroke="#29292f"/>

  <!-- Home hero -->
  <text x="55" y="165" font-family="SFMono-Regular, Consolas, monospace" font-size="10" font-weight="800" letter-spacing="2" fill="#f2b65d">RUST + TAURI V2 · SINGLE-FILE WINDOWS CLIENT</text>
  <text x="52" y="244" font-family="Georgia, 'Times New Roman', serif" font-size="61" fill="#f4f1e9" letter-spacing="-2.6">Serious</text>
  <text x="52" y="307" font-family="Georgia, 'Times New Roman', serif" font-size="61" fill="url(#accent)" letter-spacing="-2.6">performance.</text>
  <text x="55" y="355" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#f4f1e9" font-style="italic">For the Windows client.</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#a1a0a6">
    <text x="57" y="405">A lightweight desktop app for safe, reversible Roblox settings.</text>
    <text x="57" y="430">The Client tab checks your installation and helps manage only</text>
    <text x="57" y="455">Roblox-allowlisted local FastFlags — no injection or memory edits.</text>
  </g>
  <rect x="55" y="487" width="187" height="45" rx="11" fill="url(#primary)" stroke="#c8c0ff" stroke-opacity=".35"/>
  <text x="148" y="515" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" fill="#ffffff">Download for Windows  ↓</text>
  <rect x="254" y="487" width="152" height="45" rx="11" fill="#0b0b10" stroke="#29292f"/>
  <text x="330" y="515" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" fill="#c5c1d5">See the Client tab</text>
  <rect x="55" y="555" width="213" height="32" rx="16" fill="#0b0b10" stroke="#29292f"/>
  <circle cx="74" cy="571" r="4" fill="#72c7ff"/>
  <text x="87" y="575" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="800" letter-spacing=".5" fill="#c5c1d5">ONE PORTABLE WINDOWS .EXE</text>
  <rect x="277" y="555" width="176" height="32" rx="16" fill="#0b0b10" stroke="#29292f"/>
  <text x="365" y="575" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="800" letter-spacing=".5" fill="#c5c1d5">18 ALLOWLISTED FLAGS</text>

  <!-- Feature card / UI preview -->
  <rect x="710" y="148" width="515" height="477" rx="22" fill="url(#card)" stroke="#393342" stroke-width="1.2"/>
  <rect x="711" y="149" width="513" height="1" rx="1" fill="url(#accent)" opacity=".75"/>
  <circle cx="1151" cy="195" r="82" fill="#9c8cff" opacity=".045" filter="url(#glow)"/>
  <text x="742" y="187" font-family="SFMono-Regular, Consolas, monospace" font-size="10" font-weight="800" letter-spacing="1.7" fill="#a1a0a6">ROPTIMER · CLIENT</text>
  <rect x="1080" y="166" width="116" height="27" rx="13" fill="#0b171c" stroke="#72c7ff" stroke-opacity=".35"/>
  <circle cx="1097" cy="179" r="3.5" fill="#72c7ff"/>
  <text x="1107" y="183" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#9bdfff">LOCAL &amp; SAFE</text>
  <path d="M740 208h455" stroke="#29292f"/>
  <text x="742" y="243" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#f4f1e9">A focused toolkit for the Roblox client</text>
  <text x="742" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#a1a0a6">Read-only install detection · local settings · timestamped backups</text>

  <g>
    <rect x="742" y="287" width="136" height="89" rx="13" fill="#0b0b10" stroke="#29292f"/>
    <text x="759" y="321" font-family="Georgia, serif" font-size="30" fill="#f4f1e9">18</text>
    <text x="759" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#a1a0a6">ALLOWLISTED FLAGS</text>
    <rect x="890" y="287" width="136" height="89" rx="13" fill="#0b0b10" stroke="#29292f"/>
    <text x="907" y="321" font-family="Georgia, serif" font-size="30" fill="#72c7ff">3</text>
    <text x="907" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#a1a0a6">FEATURE GROUPS</text>
    <rect x="1038" y="287" width="158" height="89" rx="13" fill="#0b0b10" stroke="#29292f"/>
    <text x="1055" y="321" font-family="Georgia, serif" font-size="30" fill="#9c8cff">0</text>
    <text x="1055" y="348" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#a1a0a6">MEMORY READS</text>
  </g>

  <rect x="742" y="395" width="454" height="167" rx="13" fill="#060609" stroke="#29292f"/>
  <text x="762" y="423" font-family="SFMono-Regular, Consolas, monospace" font-size="9" font-weight="800" letter-spacing="1.4" fill="#6e6d75">FIRST-RUN CHECK · WINDOWS</text>
  <text x="762" y="457" font-family="SFMono-Regular, Consolas, monospace" font-size="11" fill="#c5c1d5"><tspan fill="#72c7ff">$</tspan> Roptimer.exe --first-run</text>
  <circle cx="768" cy="483" r="4" fill="#72c7ff"/><text x="782" y="487" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#a1a0a6">Checking standard Roblox folders…</text>
  <circle cx="768" cy="510" r="4" fill="#72c7ff"/><text x="782" y="514" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#a1a0a6">No process attach or game-memory access</text>
  <circle cx="768" cy="537" r="4" fill="#72c7ff"/><text x="782" y="541" font-family="SFMono-Regular, Consolas, monospace" font-size="10" fill="#a1a0a6">Local JSON changes stay reversible</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#a1a0a6">
    <text x="742" y="594">RUST + TAURI</text><circle cx="836" cy="591" r="2" fill="#6e6d75"/>
    <text x="850" y="594">WEBVIEW2</text><circle cx="926" cy="591" r="2" fill="#6e6d75"/>
    <text x="941" y="594">OFFLINE UI</text><circle cx="1022" cy="591" r="2" fill="#6e6d75"/>
    <text x="1037" y="594">REVERSIBLE</text>
  </g>

  <!-- Project fact strip -->
  <path d="M48 678h1184" stroke="#29292f"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="63" y="735" font-family="Georgia, serif" font-size="34" fill="#f4f1e9">18</text>
    <text x="64" y="758" font-size="9" font-weight="800" letter-spacing="1" fill="#a1a0a6">ROBLOX-ALLOWED FLAGS</text>
    <text x="320" y="735" font-family="Georgia, serif" font-size="34" fill="#f4f1e9">3</text>
    <text x="321" y="758" font-size="9" font-weight="800" letter-spacing="1" fill="#a1a0a6">FEATURE GROUPS</text>
    <text x="570" y="735" font-family="Georgia, serif" font-size="34" fill="#f4f1e9">0</text>
    <text x="571" y="758" font-size="9" font-weight="800" letter-spacing="1" fill="#a1a0a6">INJECTED DLLS</text>
    <text x="820" y="735" font-family="Georgia, serif" font-size="34" fill="#f4f1e9">100%</text>
    <text x="822" y="758" font-size="9" font-weight="800" letter-spacing="1" fill="#a1a0a6">LOCAL &amp; REVERSIBLE</text>
    <rect x="1044" y="711" width="176" height="58" rx="14" fill="#0b0b10" stroke="#29292f"/>
    <text x="1060" y="735" font-size="10" font-weight="800" fill="#f2b65d">NEXT: CLIENT TAB</text>
    <text x="1060" y="754" font-size="9" fill="#a1a0a6">Detection + settings builder</text>
  </g>
  <text x="54" y="846" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#6e6d75">Illustrative interface preview · shared web UI shown inside the Roptimer Tauri window</text>
</svg>
