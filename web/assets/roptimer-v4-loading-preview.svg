<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Roptimer V4 startup loading screen preview</title>
  <desc id="desc">A dark violet and blue startup splash for the Roptimer Windows desktop app, showing the local Roblox installation scan and a progress bar.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="43%" r="72%"><stop offset="0" stop-color="#17132a"/><stop offset=".50" stop-color="#090910"/><stop offset="1" stop-color="#040407"/></radialGradient>
    <radialGradient id="centerGlow"><stop offset="0" stop-color="#9c8cff" stop-opacity=".30"/><stop offset=".65" stop-color="#72c7ff" stop-opacity=".07"/><stop offset="1" stop-color="#9c8cff" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9c8cff"/><stop offset=".56" stop-color="#72c7ff"/><stop offset="1" stop-color="#f2b65d"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#171522"/><stop offset="1" stop-color="#09090f"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="20" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="stars" width="180" height="150" patternUnits="userSpaceOnUse"><circle cx="19" cy="28" r="1" fill="#fff" opacity=".72"/><circle cx="112" cy="45" r="1" fill="#72c7ff" opacity=".70"/><circle cx="78" cy="104" r="1.2" fill="#fff" opacity=".54"/><circle cx="158" cy="125" r=".8" fill="#9c8cff" opacity=".82"/></pattern>
  </defs>
  <rect width="1280" height="900" rx="18" fill="url(#background)"/>
  <rect width="1280" height="900" rx="18" fill="url(#stars)" opacity=".55"/>
  <circle cx="640" cy="423" r="410" fill="url(#centerGlow)"/>
  <circle cx="640" cy="423" r="300" fill="none" stroke="#9c8cff" stroke-opacity=".11"/>
  <circle cx="640" cy="423" r="244" fill="none" stroke="#72c7ff" stroke-opacity=".08"/>
  <circle cx="640" cy="423" r="178" fill="none" stroke="#9c8cff" stroke-opacity=".10" stroke-dasharray="3 12"/>

  <!-- Native desktop title bar -->
  <rect width="1280" height="38" rx="18" fill="#08080d"/>
  <rect y="18" width="1280" height="20" fill="#08080d"/>
  <circle cx="18" cy="19" r="4" fill="#ff6b6b"/><circle cx="34" cy="19" r="4" fill="#f2b65d"/><circle cx="50" cy="19" r="4" fill="#72c7ff"/>
  <text x="72" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a1a0a6">Roptimer — Windows Client</text>
  <path d="M1197 18h12m25-5v12m24-12 12 12m0-12-12 12" fill="none" stroke="#a1a0a6" stroke-width="1.3" opacity=".75"/>
  <path d="M0 38h1280" stroke="#29292f"/>

  <rect x="402" y="178" width="476" height="520" rx="28" fill="url(#card)" stroke="#4b4168" stroke-opacity=".72"/>
  <rect x="403" y="179" width="474" height="1" rx="1" fill="url(#accent)" opacity=".8"/>
  <rect x="430" y="207" width="36" height="36" rx="11" fill="#201a31" stroke="#9c8cff" stroke-opacity=".64"/>
  <text x="448" y="232" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="700" fill="#f7f5ff">R</text>
  <text x="479" y="230" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="900" letter-spacing="1.5" fill="#f4f1e9">ROPTIMER</text>
  <text x="570" y="230" font-family="SFMono-Regular, Consolas, monospace" font-size="9" font-weight="700" fill="#72c7ff">V4</text>
  <rect x="724" y="211" width="126" height="26" rx="13" fill="#0b171c" stroke="#72c7ff" stroke-opacity=".34"/>
  <circle cx="740" cy="224" r="3" fill="#72c7ff"/>
  <text x="751" y="228" font-family="SFMono-Regular, Consolas, monospace" font-size="8" font-weight="700" letter-spacing=".5" fill="#b8eaff">LOCAL · SAFE</text>

  <circle cx="640" cy="356" r="74" fill="#0b0a12" fill-opacity=".84" stroke="#9c8cff" stroke-opacity=".23"/>
  <circle cx="640" cy="356" r="62" fill="none" stroke="#72c7ff" stroke-opacity=".35" stroke-dasharray="88 38 40 28" stroke-width="2"/>
  <circle cx="640" cy="356" r="83" fill="none" stroke="#f2b65d" stroke-opacity=".33" stroke-dasharray="30 80 46 120" stroke-width="1.5"/>
  <circle cx="698" cy="307" r="5" fill="#72c7ff" filter="url(#glow)"/>
  <circle cx="581" cy="394" r="3" fill="#f2b65d" filter="url(#glow)"/>
  <text x="640" y="373" text-anchor="middle" font-family="Georgia, serif" font-size="48" font-weight="700" fill="#f7f5ff" filter="url(#glow)">R</text>

  <text x="640" y="476" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="8" font-weight="900" letter-spacing="2" fill="#f2b65d">RUST + TAURI · WINDOWS CLIENT</text>
  <text x="640" y="528" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#f4f1e9" letter-spacing="-1">Getting things ready<tspan fill="#72c7ff">.</tspan></text>
  <text x="640" y="562" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#b9b4d2">Scanning standard Roblox installation folders…</text>

  <rect x="455" y="590" width="370" height="8" rx="4" fill="#08080d" stroke="#342f43"/>
  <rect x="456" y="591" width="269" height="6" rx="3" fill="url(#accent)"/>
  <circle cx="725" cy="594" r="4" fill="#d8d0ff" stroke="#9c8cff" stroke-width="1" filter="url(#glow)"/>
  <g font-family="SFMono-Regular, Consolas, monospace" font-size="7.5" font-weight="800" letter-spacing="1.1" fill="#7d789c">
    <text x="455" y="638">OFFLINE-READY UI</text>
    <text x="825" y="638" text-anchor="end">LOCAL SETTINGS ONLY</text>
  </g>
  <text x="640" y="755" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#6e6d75">Install scan is read-only · no process attach · no game-memory access</text>
</svg>
