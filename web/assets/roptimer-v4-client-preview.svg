<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">Roptimer V4 Client tab and settings builder preview</title>
  <desc id="desc">An illustrative preview of the Client tab, with sample Roblox installation detection, optimization profile controls, and Apply safely and Restore buttons.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#11101a"/><stop offset=".50" stop-color="#08080d"/><stop offset="1" stop-color="#050506"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9c8cff"/><stop offset="1" stop-color="#72c7ff"/></linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8f7cff"/><stop offset="1" stop-color="#4c80bd"/></linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101016"/><stop offset="1" stop-color="#0a0a0e"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".02" stroke-width="1"/></pattern>
  </defs>

  <rect width="1280" height="900" rx="18" fill="url(#page)"/>
  <rect width="1280" height="900" rx="18" fill="url(#grid)"/>
  <circle cx="1190" cy="420" r="250" fill="#9c8cff" opacity=".07" filter="url(#glow)"/>

  <!-- Native desktop title bar -->
  <rect width="1280" height="38" rx="18" fill="#09090d"/>
  <rect y="18" width="1280" height="20" fill="#09090d"/>
  <circle cx="18" cy="19" r="4" fill="#ff6b6b"/><circle cx="34" cy="19" r="4" fill="#f2b65d"/><circle cx="50" cy="19" r="4" fill="#72c7ff"/>
  <text x="72" y="24" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a1a0a6">Roptimer — Windows Client</text>
  <path d="M1197 18h12m25-5v12m24-12 12 12m0-12-12 12" fill="none" stroke="#a1a0a6" stroke-width="1.3" opacity=".75"/>
  <path d="M0 38h1280" stroke="#29292f"/>

  <!-- Shared app header -->
  <rect y="39" width="1280" height="72" fill="#070709" fill-opacity=".96"/>
  <rect x="32" y="57" width="38" height="38" rx="11" fill="#171421" stroke="#9c8cff" stroke-opacity=".6"/>
  <text x="51" y="83" text-anchor="middle" font-family="Georgia, serif" font-size="24" font-weight="700" fill="#f4f1e9">R</text>
  <text x="82" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#f4f1e9">Roptimer</text>
  <rect x="166" y="65" width="38" height="21" rx="10" fill="#14131a" stroke="#29292f"/>
  <text x="185" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="800" fill="#a1a0a6">V4</text>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">
    <rect x="431" y="55" width="104" height="40" rx="10" fill="#171521" stroke="#9c8cff" stroke-opacity=".30"/>
    <text x="483" y="80" text-anchor="middle" fill="#f4f1e9">Client</text>
    <text x="574" y="80" text-anchor="middle" fill="#a1a0a6">Allowlist</text>
    <text x="683" y="80" text-anchor="middle" fill="#a1a0a6">Downloads</text>
    <text x="788" y="80" text-anchor="middle" fill="#a1a0a6">Docs</text>
  </g>
  <rect x="1005" y="57" width="54" height="36" rx="10" fill="#0d0d12" stroke="#29292f"/>
  <text x="1032" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" fill="#a1a0a6">◆  K</text>
  <rect x="1071" y="57" width="177" height="36" rx="10" fill="url(#primary)"/>
  <text x="1159" y="80" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="800" fill="#ffffff">Get the Windows app</text>
  <path d="M0 110h1280" stroke="#29292f"/>

  <!-- Main tab selector -->
  <rect x="48" y="130" width="1184" height="59" rx="15" fill="#09090e" stroke="#29292f"/>
  <g font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800">
    <rect x="57" y="138" width="285" height="43" rx="10" fill="#1a1724" stroke="#9c8cff" stroke-opacity=".30"/>
    <text x="77" y="165" fill="#f2b65d" font-family="SFMono-Regular, Consolas, monospace" font-size="10">01</text>
    <text x="108" y="165" fill="#f4f1e9">Client</text>
    <text x="393" y="165" fill="#6e6d75" font-family="SFMono-Regular, Consolas, monospace" font-size="10">02</text><text x="424" y="165" fill="#a1a0a6">Allowlist</text>
    <text x="688" y="165" fill="#6e6d75" font-family="SFMono-Regular, Consolas, monospace" font-size="10">03</text><text x="719" y="165" fill="#a1a0a6">Downloads</text>
    <text x="983" y="165" fill="#6e6d75" font-family="SFMono-Regular, Consolas, monospace" font-size="10">04</text><text x="1014" y="165" fill="#a1a0a6">Docs</text>
  </g>

  <!-- Main tab heading -->
  <rect x="53" y="211" width="8" height="8" rx="2" fill="#72c7ff"/>
  <text x="70" y="219" font-family="SFMono-Regular, Consolas, monospace" font-size="9" font-weight="800" letter-spacing="1.6" fill="#f2b65d">WINDOWS CLIENT · MAIN TAB</text>
  <text x="51" y="267" font-family="Georgia, 'Times New Roman', serif" font-size="42" fill="#f4f1e9">The Client</text>
  <text x="53" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#a1a0a6">Detect an installation, tune a profile, apply safe local settings, or restore your backup.</text>
  <rect x="1034" y="237" width="196" height="29" rx="14" fill="#15121b" stroke="#9c8cff" stroke-opacity=".28"/>
  <text x="1132" y="256" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="800" fill="#c5c1d5">WINDOWS ONLY · LOCAL JSON</text>

  <!-- Roblox detection panel -->
  <rect x="48" y="319" width="547" height="481" rx="18" fill="url(#panel)" stroke="#29292f"/>
  <text x="72" y="357" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#f4f1e9">Roblox detection on first run</text>
  <text x="73" y="383" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#a1a0a6">Scans normal Windows install folders. Read-only; no process attach,</text>
  <text x="73" y="400" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#a1a0a6">memory reads, or game launch is performed by detection.</text>

  <rect x="72" y="418" width="499" height="117" rx="14" fill="#0a1015" stroke="#72c7ff" stroke-opacity=".45"/>
  <rect x="88" y="434" width="41" height="41" rx="12" fill="#10202a" stroke="#72c7ff" stroke-opacity=".25"/>
  <text x="108" y="462" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#9bdfff">⊞</text>
  <text x="145" y="452" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#f4f1e9">Roblox is installed</text>
  <text x="145" y="473" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#a1a0a6">Example result — your app shows the scan from your PC.</text>
  <text x="145" y="493" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#a1a0a6">Roptimer can manage allowlisted local settings safely.</text>
  <rect x="145" y="503" width="102" height="20" rx="10" fill="#0d1419" stroke="#29292f"/>
  <text x="196" y="517" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#c5c1d5"><tspan fill="#72c7ff" font-weight="800">2</tspan> version folders</text>
  <rect x="253" y="503" width="99" height="20" rx="10" fill="#0d1419" stroke="#29292f"/>
  <text x="302" y="517" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#c5c1d5"><tspan fill="#72c7ff" font-weight="800">2</tspan> settings files</text>
  <rect x="358" y="503" width="78" height="20" rx="10" fill="#0d1419" stroke="#29292f"/>
  <text x="397" y="517" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#c5c1d5">Windows</text>
  <rect x="452" y="503" width="91" height="22" rx="8" fill="#101015" stroke="#29292f"/>
  <text x="497" y="518" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="8" font-weight="700" fill="#a1a0a6">Re-scan</text>

  <rect x="72" y="550" width="499" height="69" rx="12" fill="#0c0b11" stroke="#29292f"/>
  <rect x="88" y="566" width="28" height="28" rx="8" fill="#14131b"/>
  <text x="102" y="585" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9c8cff">⊞</text>
  <text x="128" y="574" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#c5c1d5">The Client tab and FastFlag manager are Windows-only.</text>
  <text x="128" y="592" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#a1a0a6">The companion Mac tool is separate and does not include them.</text>

  <g font-family="Segoe UI, Arial, sans-serif">
    <rect x="72" y="635" width="239" height="62" rx="12" fill="#0b0b10" stroke="#29292f"/>
    <text x="90" y="665" font-family="Georgia, serif" font-size="26" fill="#f4f1e9">18</text>
    <text x="90" y="683" font-size="8" font-weight="800" letter-spacing=".5" fill="#a1a0a6">ALLOWLISTED KEYS</text>
    <rect x="323" y="635" width="248" height="62" rx="12" fill="#0b0b10" stroke="#29292f"/>
    <text x="341" y="665" font-family="Georgia, serif" font-size="26" fill="#72c7ff">0</text>
    <text x="341" y="683" font-size="8" font-weight="800" letter-spacing=".5" fill="#a1a0a6">MEMORY READS</text>
  </g>
  <rect x="72" y="711" width="499" height="60" rx="11" fill="#09090d" stroke="#29292f"/>
  <rect x="86" y="727" width="29" height="29" rx="8" fill="#14131b" stroke="#29292f"/>
  <text x="100" y="747" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#9c8cff">◉</text>
  <text x="126" y="733" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#f4f1e9">Roblox Player is not running</text>
  <text x="126" y="750" font-family="Segoe UI, Arial, sans-serif" font-size="8" fill="#a1a0a6">Process-name check only · no game thumbnail or server data</text>
  <rect x="451" y="719" width="105" height="18" rx="9" fill="#101015" stroke="#29292f"/>
  <text x="503" y="731" text-anchor="middle" font-family="SFMono-Regular, Consolas, monospace" font-size="7" font-weight="800" fill="#6e6d75">NOT RUNNING</text>
  <rect x="392" y="744" width="62" height="20" rx="7" fill="#0c0c11" stroke="#29292f"/>
  <text x="423" y="757" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="800" fill="#a1a0a6">Refresh</text>
  <rect x="460" y="744" width="96" height="20" rx="7" fill="url(#primary)"/>
  <text x="508" y="757" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="7" font-weight="800" fill="#ffffff">Open optimizations</text>

  <!-- Safe settings builder -->
  <rect x="613" y="319" width="619" height="481" rx="18" fill="url(#panel)" stroke="#29292f"/>
  <text x="637" y="357" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#f4f1e9">Safe settings builder</text>
  <text x="638" y="382" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#a1a0a6">Choose a profile and review what will be written locally.</text>

  <text x="638" y="419" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#a1a0a6">Optimization mode</text>
  <text x="1187" y="419" text-anchor="end" font-family="Segoe UI, Arial, sans-serif" font-size="9" font-weight="700" fill="#f4f1e9">Reduce building lag</text>
  <rect x="638" y="428" width="569" height="36" rx="9" fill="#08080e" stroke="#29292f"/>
  <text x="654" y="451" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#c5c1d5">Reduce building lag</text>
  <path d="m1187 443 6 6 6-6" fill="none" stroke="#a1a0a6" stroke-width="1.4"/>

  <text x="638" y="488" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#a1a0a6">Graphics tier</text>
  <text x="1207" y="488" text-anchor="end" font-family="SFMono-Regular, Consolas, monospace" font-size="9" font-weight="700" fill="#f4f1e9">21</text>
  <path d="M641 503h566" stroke="#282631" stroke-width="4" stroke-linecap="round"/><path d="M641 503h534" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/><circle cx="1175" cy="503" r="6" fill="#d4ccff" stroke="#9c8cff" stroke-width="2"/>

  <text x="638" y="533" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#a1a0a6">Texture tier</text>
  <text x="1207" y="533" text-anchor="end" font-family="SFMono-Regular, Consolas, monospace" font-size="9" font-weight="700" fill="#f4f1e9">0</text>
  <path d="M641 548h566" stroke="#282631" stroke-width="4" stroke-linecap="round"/><circle cx="641" cy="548" r="6" fill="#d4ccff" stroke="#9c8cff" stroke-width="2"/>

  <text x="638" y="578" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#a1a0a6">FPS target <tspan fill="#f2b65d">(legacy; may be ignored)</tspan></text>
  <text x="1207" y="578" text-anchor="end" font-family="SFMono-Regular, Consolas, monospace" font-size="9" font-weight="700" fill="#f4f1e9">144</text>
  <path d="M641 593h566" stroke="#282631" stroke-width="4" stroke-linecap="round"/><path d="M641 593h273" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/><circle cx="914" cy="593" r="6" fill="#d4ccff" stroke="#9c8cff" stroke-width="2"/>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#c5c1d5">
    <rect x="638" y="614" width="13" height="13" rx="4" fill="#9c8cff"/><path d="m641 620 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.4"/>
    <text x="659" y="624">Legacy FPS flag</text>
    <rect x="793" y="614" width="13" height="13" rx="4" fill="#9c8cff"/><path d="m796 620 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.4"/>
    <text x="814" y="624">All detected versions</text>
    <rect x="1000" y="614" width="13" height="13" rx="4" fill="#9c8cff"/><path d="m1003 620 3 3 5-6" fill="none" stroke="#fff" stroke-width="1.4"/>
    <text x="1021" y="624">Reduce VFX</text>
  </g>

  <rect x="638" y="643" width="569" height="80" rx="10" fill="#060609" stroke="#29292f"/>
  <text x="654" y="662" font-family="SFMono-Regular, Consolas, monospace" font-size="8" font-weight="800" letter-spacing="1" fill="#6e6d75">GENERATED COMMAND PREVIEW</text>
  <text x="654" y="681" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5" fill="#a5e5ff">RoptimerBoost.exe apply --mode "Reduce building lag"</text>
  <text x="654" y="696" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5" fill="#a5e5ff">--fps 144 --tier 21 --texture 0 --vfx</text>
  <text x="654" y="711" font-family="SFMono-Regular, Consolas, monospace" font-size="8.5" fill="#a5e5ff">--all-versions --no-launch</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="8.5" font-weight="800">
    <rect x="638" y="735" width="95" height="32" rx="8" fill="#0c0c11" stroke="#29292f"/>
    <text x="685" y="755" text-anchor="middle" fill="#c5c1d5">Copy command</text>
    <rect x="741" y="735" width="58" height="32" rx="8" fill="#0c0c11" stroke="#29292f"/>
    <text x="770" y="755" text-anchor="middle" fill="#a1a0a6">Reset</text>
    <rect x="807" y="735" width="92" height="32" rx="8" fill="#0c0c11" stroke="#29292f"/>
    <text x="853" y="755" text-anchor="middle" fill="#c5c1d5">Save profile</text>
    <rect x="907" y="735" width="113" height="32" rx="8" fill="url(#primary)"/>
    <text x="963" y="755" text-anchor="middle" fill="#ffffff">Apply safely</text>
    <rect x="1028" y="735" width="74" height="32" rx="8" fill="#0c0c11" stroke="#29292f"/>
    <text x="1065" y="755" text-anchor="middle" fill="#a1a0a6">Restore</text>
  </g>
  <text x="638" y="790" font-family="Segoe UI, Arial, sans-serif" font-size="8.5" fill="#6e6d75">Apply backs up the local JSON; Restore reverses Roptimer-managed keys.</text>

  <!-- Preview note / UI scope -->
  <path d="M49 829h1183" stroke="#29292f"/>
  <text x="53" y="857" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#a1a0a6">Illustrative interface preview · scan counts and selected values are examples, not live data from a running EXE.</text>
  <text x="53" y="876" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#6e6d75">Current V4 GUI applies/restores settings; launch Roblox separately. It does not display current game or server address.</text>
</svg>
